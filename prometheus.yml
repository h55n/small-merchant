# Prometheus configuration for Small-Merchant AI Readiness Agent
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "ai-readiness-agent"

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
